server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Vite fingerprints these, so they can be cached indefinitely.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# The vendored Spine runtime is not fingerprinted, so it gets a shorter life.
	location /vendor/ {
		expires 7d;
		add_header Cache-Control "public";
	}

	# The app uses HashRouter, so routes never reach nginx. The fallback is here anyway so switching
	# to BrowserRouter does not silently start returning 404s.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
